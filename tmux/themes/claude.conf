# ══════════════════════════════════════════════════════════════════════════════
#                              Claude Theme for Tmux
#                         Warm, earthy tones
# ══════════════════════════════════════════════════════════════════════════════

# Color palette
# bg:         #1a1816
# bg_light:   #2a2725
# fg:         #e8dfd6
# coral:      #d4a27f
# terracotta: #c4746e
# sand:       #c4b28a
# sage:       #8a9a7b
# dusty_rose: #a292a3
# teal:       #8ea4a2
# warm_gray:  #625e5a

# ══════════════════════════════════════════════════════════════════════════════
#                              Pane Borders
# ══════════════════════════════════════════════════════════════════════════════

set -g pane-border-style "fg=#625e5a"
set -g pane-active-border-style "fg=#d4a27f"

# ══════════════════════════════════════════════════════════════════════════════
#                              Status Bar
# ══════════════════════════════════════════════════════════════════════════════

# Status bar position and style
set -g status-position bottom
set -g status-justify left
set -g status-style "bg=#1a1816,fg=#e8dfd6"

# Status bar length
set -g status-left-length 100
set -g status-right-length 100

# Update interval
set -g status-interval 5

# ══════════════════════════════════════════════════════════════════════════════
#                              Left Status
# ══════════════════════════════════════════════════════════════════════════════

# Session name with Claude icon
set -g status-left "\
#[fg=#1a1816,bg=#d4a27f,bold] ◠◡◠ #S \
#[fg=#d4a27f,bg=#2a2725]\
#[fg=#e8dfd6,bg=#2a2725] #{?client_prefix,#[fg=#c4746e]PREFIX,} \
#[fg=#2a2725,bg=#1a1816]"

# ══════════════════════════════════════════════════════════════════════════════
#                              Window Status
# ══════════════════════════════════════════════════════════════════════════════

# Window status format
set -g window-status-format "\
#[fg=#625e5a,bg=#1a1816] #I \
#[fg=#e8dfd6,bg=#1a1816]#W "

# Active window status format
set -g window-status-current-format "\
#[fg=#1a1816,bg=#2a2725]\
#[fg=#d4a27f,bg=#2a2725,bold] #I \
#[fg=#e8dfd6,bg=#2a2725,bold]#W \
#[fg=#2a2725,bg=#1a1816]"

# Window status separator
set -g window-status-separator ""

# ══════════════════════════════════════════════════════════════════════════════
#                              Right Status
# ══════════════════════════════════════════════════════════════════════════════

# System info on the right
set -g status-right "\
#[fg=#2a2725,bg=#1a1816]\
#[fg=#8ea4a2,bg=#2a2725]  #(whoami) \
#[fg=#625e5a,bg=#2a2725]\
#[fg=#c4b28a,bg=#2a2725]  %H:%M \
#[fg=#d4a27f,bg=#2a2725]\
#[fg=#1a1816,bg=#d4a27f,bold]  %d-%b "

# ══════════════════════════════════════════════════════════════════════════════
#                              Messages
# ══════════════════════════════════════════════════════════════════════════════

# Message style
set -g message-style "fg=#e8dfd6,bg=#2a2725"
set -g message-command-style "fg=#e8dfd6,bg=#2a2725"

# ══════════════════════════════════════════════════════════════════════════════
#                              Mode (Copy mode, etc.)
# ══════════════════════════════════════════════════════════════════════════════

set -g mode-style "fg=#1a1816,bg=#d4a27f"

# ══════════════════════════════════════════════════════════════════════════════
#                              Clock
# ══════════════════════════════════════════════════════════════════════════════

set -g clock-mode-colour "#d4a27f"
set -g clock-mode-style 24

# ══════════════════════════════════════════════════════════════════════════════
#                              Bell
# ══════════════════════════════════════════════════════════════════════════════

set -g window-status-bell-style "fg=#c4746e,bg=#1a1816,bold"

# ══════════════════════════════════════════════════════════════════════════════
#                              Activity
# ══════════════════════════════════════════════════════════════════════════════

set -g window-status-activity-style "fg=#c4b28a,bg=#1a1816"
set -g monitor-activity on
set -g visual-activity off
