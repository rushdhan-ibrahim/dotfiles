# ══════════════════════════════════════════════════════════════════════════════
#                              Tmux Configuration
#                         Claude-themed multiplexer
# ══════════════════════════════════════════════════════════════════════════════

# ══════════════════════════════════════════════════════════════════════════════
#                              General Settings
# ══════════════════════════════════════════════════════════════════════════════

# True color support
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"

# Enable mouse support
set -g mouse on

# Start windows and panes at 1, not 0
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set -g renumber-windows on

# Increase history limit
set -g history-limit 50000

# Faster command sequences
set -s escape-time 0

# Increase repeat time for repeatable commands
set -g repeat-time 1000

# Focus events for vim
set -g focus-events on

# Aggressive resize
setw -g aggressive-resize on

# ══════════════════════════════════════════════════════════════════════════════
#                              Prefix Key
# ══════════════════════════════════════════════════════════════════════════════

# Change prefix from C-b to C-a (more ergonomic)
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# ══════════════════════════════════════════════════════════════════════════════
#                              Key Bindings
# ══════════════════════════════════════════════════════════════════════════════

# Reload config
bind r source-file ~/.tmux.conf \; display-message "Config reloaded!"

# Split panes using | and - (more intuitive)
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind \\ split-window -h -c "#{pane_current_path}"
unbind '"'
unbind %

# New window in current path
bind c new-window -c "#{pane_current_path}"

# Vim-style pane navigation
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Alt + arrow keys to switch panes (no prefix)
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

# Shift + arrow to switch windows (no prefix)
bind -n S-Left previous-window
bind -n S-Right next-window

# Resize panes with Prefix + HJKL
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Maximize/minimize pane
bind z resize-pane -Z

# Kill pane/window without confirmation
bind x kill-pane
bind X kill-window

# Swap windows
bind -r "<" swap-window -d -t -1
bind -r ">" swap-window -d -t +1

# ══════════════════════════════════════════════════════════════════════════════
#                              Copy Mode (Vi style)
# ══════════════════════════════════════════════════════════════════════════════

# Use vi keys in copy mode
setw -g mode-keys vi

# Enter copy mode with Prefix + [
bind [ copy-mode

# Vi-style copy
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind -T copy-mode-vi y send-keys -X copy-selection-and-cancel
bind -T copy-mode-vi Escape send-keys -X cancel

# Copy to system clipboard (macOS)
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "pbcopy"
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "pbcopy"

# Paste with Prefix + p
bind p paste-buffer

# ══════════════════════════════════════════════════════════════════════════════
#                              Session Management
# ══════════════════════════════════════════════════════════════════════════════

# Switch sessions
bind s choose-tree -sZ

# Create new session
bind S new-session

# Detach
bind d detach-client

# ══════════════════════════════════════════════════════════════════════════════
#                              Theme (Claude Colors)
# ══════════════════════════════════════════════════════════════════════════════

source-file ~/.config/tmux/themes/claude.conf

# ══════════════════════════════════════════════════════════════════════════════
#                              Plugins (TPM)
# ══════════════════════════════════════════════════════════════════════════════

# Plugin manager
set -g @plugin 'tmux-plugins/tpm'

# Sensible defaults
set -g @plugin 'tmux-plugins/tmux-sensible'

# Session persistence
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# Better copy/paste
set -g @plugin 'tmux-plugins/tmux-yank'

# FZF integration
set -g @plugin 'sainnhe/tmux-fzf'

# Resurrect settings
set -g @resurrect-capture-pane-contents 'on'
set -g @resurrect-strategy-nvim 'session'

# Continuum settings
set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'

# Initialize TPM (keep at the very bottom)
run '~/.tmux/plugins/tpm/tpm'
