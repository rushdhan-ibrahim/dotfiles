# Claude/Anthropic themed terminal
# Warm, muted, earthy tones

format = """
$username\
$hostname\
$directory\
$git_branch\
$git_status\
$git_metrics\
$python\
$nodejs\
$rust\
$golang\
$java\
$package\
$cmd_duration\
$line_break\
$character"""

# Make prompt span two lines with breathing room
add_newline = true

# Right side prompt
right_format = """$time"""

[character]
success_symbol = "[❯](bold #d4a27f)"
error_symbol = "[❯](bold #c4746e)"
vimcmd_symbol = "[❮](bold #8a9a7b)"

[directory]
style = "bold #c4b28a"
format = "[$path]($style)[$read_only]($read_only_style) "
truncation_length = 4
truncate_to_repo = true
read_only = " "
read_only_style = "#c4746e"

[directory.substitutions]
"Documents" = "󰈙 "
"Downloads" = " "
"Music" = "󰝚 "
"Pictures" = " "
"Developer" = " "
"~" = " "

[git_branch]
symbol = " "
style = "bold #d4a27f"
format = "on [$symbol$branch(:$remote_branch)]($style) "

[git_status]
style = "#a292a3"
format = '([$all_status$ahead_behind]($style) )'
conflicted = "="
ahead = "⇡${count}"
behind = "⇣${count}"
diverged = "⇕⇡${ahead_count}⇣${behind_count}"
untracked = "?${count}"
stashed = "$${count}"
modified = "!${count}"
staged = "+${count}"
renamed = "»${count}"
deleted = "✘${count}"

[git_metrics]
disabled = false
added_style = "#8a9a7b"
deleted_style = "#c4746e"
format = '([+$added]($added_style) )([-$deleted]($deleted_style) )'

[cmd_duration]
min_time = 2_000
style = "#625e5a"
format = "took [$duration]($style) "

[time]
disabled = false
style = "#625e5a"
format = "[$time]($style)"
time_format = "%H:%M"

[username]
style_user = "#d4a27f"
style_root = "bold #c4746e"
format = "[$user]($style) in "
show_always = false

[hostname]
ssh_only = true
style = "#8ea4a2"
format = "[@$hostname]($style) "

[python]
symbol = " "
style = "#c4b28a"
format = 'via [$symbol$pyenv_prefix($version )(\($virtualenv\) )]($style)'

[nodejs]
symbol = " "
style = "#8a9a7b"
format = "via [$symbol($version )]($style)"

[rust]
symbol = " "
style = "#d4a27f"
format = "via [$symbol($version )]($style)"

[golang]
symbol = " "
style = "#8ea4a2"
format = "via [$symbol($version )]($style)"

[java]
symbol = " "
style = "#c4746e"
format = "via [$symbol($version )]($style)"

[package]
symbol = "󰏗 "
style = "#a292a3"
format = "is [$symbol$version]($style) "
