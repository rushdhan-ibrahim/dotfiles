# ══════════════════════════════════════════════════════════════════════════════
#                              Lazygit Configuration
#                         Claude-themed git TUI
# ══════════════════════════════════════════════════════════════════════════════

# ══════════════════════════════════════════════════════════════════════════════
#                              GUI Settings
# ══════════════════════════════════════════════════════════════════════════════

gui:
  # Claude color theme
  theme:
    activeBorderColor:
      - "#d4a27f"  # coral
      - bold
    inactiveBorderColor:
      - "#625e5a"  # warm_gray
    optionsTextColor:
      - "#8ea4a2"  # teal
    selectedLineBgColor:
      - "#2a2725"  # bg_light
    cherryPickedCommitBgColor:
      - "#3a3735"
    cherryPickedCommitFgColor:
      - "#8a9a7b"  # sage
    unstagedChangesColor:
      - "#c4746e"  # terracotta
    defaultFgColor:
      - "#e8dfd6"  # fg
    searchingActiveBorderColor:
      - "#c4b28a"  # sand

  # Layout
  showFileTree: true
  showListFooter: true
  showRandomTip: false
  showBottomLine: true
  showPanelJumps: true
  showCommandLog: true
  commandLogSize: 8

  # Nerd fonts
  nerdFontsVersion: "3"

  # Window
  border: rounded
  windowSize: normal
  mainPanelSplitMode: flexible
  expandFocusedSidePanel: true
  sidePanelWidth: 0.3333

  # Commit
  commitLength:
    show: true

  # Diff
  skipDiscardChangeWarning: false
  skipStashWarning: false

  # Mouse
  mouseEvents: true

  # Time format
  timeFormat: "02 Jan 06"
  shortTimeFormat: "3:04PM"

  # Author display
  authorColors: {}
  showDivergenceFromBaseBranch: arrowAndNumber

# ══════════════════════════════════════════════════════════════════════════════
#                              Git Settings
# ══════════════════════════════════════════════════════════════════════════════

git:
  paging:
    colorArg: always
    pager: delta --paging=never

  commit:
    signOff: false
    autoWrapCommitMessage: true
    autoWrapWidth: 72

  merging:
    manualCommit: false
    args: ""

  mainBranches:
    - main
    - master

  skipHookPrefix: WIP

  autoFetch: true
  autoRefresh: true

  branchLogCmd: "git log --graph --color=always --abbrev-commit --decorate --date=relative --pretty=format:'%C(#d4a27f)%h%C(reset) -%C(#c4b28a)%d%C(reset) %s %C(#625e5a)(%cr)%C(reset) %C(#8ea4a2)<%an>%C(reset)' {{branchName}} --"

  allBranchesLogCmd: "git log --graph --all --color=always --abbrev-commit --decorate --date=relative --pretty=format:'%C(#d4a27f)%h%C(reset) -%C(#c4b28a)%d%C(reset) %s %C(#625e5a)(%cr)%C(reset) %C(#8ea4a2)<%an>%C(reset)'"

  parseEmoji: true

# ══════════════════════════════════════════════════════════════════════════════
#                              Keybindings
# ══════════════════════════════════════════════════════════════════════════════

keybinding:
  universal:
    quit: 'q'
    quit-alt1: '<c-c>'
    return: '<esc>'
    togglePanel: '<tab>'
    prevItem: '<up>'
    nextItem: '<down>'
    prevItem-alt: 'k'
    nextItem-alt: 'j'
    prevPage: ','
    nextPage: '.'
    scrollLeft: 'H'
    scrollRight: 'L'
    gotoTop: '<'
    gotoBottom: '>'
    prevBlock: '<left>'
    nextBlock: '<right>'
    prevBlock-alt: 'h'
    nextBlock-alt: 'l'
    nextMatch: 'n'
    prevMatch: 'N'
    startSearch: '/'
    optionMenu: '?'
    select: '<space>'
    goInto: '<enter>'
    confirm: '<enter>'
    remove: 'd'
    new: 'n'
    edit: 'e'
    openFile: 'o'
    scrollUpMain: '<pgup>'
    scrollDownMain: '<pgdown>'
    scrollUpMain-alt1: 'K'
    scrollDownMain-alt1: 'J'
    executeCustomCommand: ':'
    createRebaseOptionsMenu: 'm'
    pushFiles: 'P'
    pullFiles: 'p'
    refresh: 'R'
    createPatchOptionsMenu: '<c-p>'
    nextTab: ']'
    prevTab: '['
    nextScreenMode: '+'
    prevScreenMode: '_'
    undo: 'z'
    redo: '<c-z>'
    filteringMenu: '<c-s>'
    diffingMenu: 'W'
    copyToClipboard: '<c-o>'
    openRecentRepos: '<c-r>'
    submitEditorText: '<enter>'
    extrasMenu: '@'
    toggleWhitespaceInDiffView: '<c-w>'
    increaseContextInDiffView: '}'
    decreaseContextInDiffView: '{'
    toggleRangeSelect: 'v'

  status:
    checkForUpdate: 'u'
    recentRepos: '<enter>'

  files:
    commitChanges: 'c'
    commitChangesWithoutHook: 'w'
    amendLastCommit: 'A'
    commitChangesWithEditor: 'C'
    ignoreFile: 'i'
    refreshFiles: 'r'
    stashAllChanges: 's'
    viewStashOptions: 'S'
    toggleStagedAll: 'a'
    viewResetOptions: 'D'
    fetch: 'f'
    toggleTreeView: '`'
    openMergeTool: 'M'
    openStatusFilter: '<c-b>'

  branches:
    createPullRequest: 'o'
    viewPullRequestOptions: 'O'
    copyPullRequestURL: '<c-y>'
    checkoutBranchByName: 'c'
    forceCheckoutBranch: 'F'
    rebaseBranch: 'r'
    renameBranch: 'R'
    mergeIntoCurrentBranch: 'M'
    viewGitFlowOptions: 'i'
    fastForward: 'f'
    createTag: 'T'
    pushTag: 'P'
    setUpstream: 'u'
    fetchRemote: 'f'

  commits:
    squashDown: 's'
    renameCommit: 'r'
    renameCommitWithEditor: 'R'
    viewResetOptions: 'g'
    markCommitAsFixup: 'f'
    createFixupCommit: 'F'
    squashAboveCommits: 'S'
    moveDownCommit: '<c-j>'
    moveUpCommit: '<c-k>'
    amendToCommit: 'A'
    resetCommitAuthor: 'a'
    pickCommit: 'p'
    revertCommit: 't'
    cherryPickCopy: 'c'
    cherryPickCopyRange: 'C'
    pasteCommits: 'v'
    tagCommit: 'T'
    checkoutCommit: '<space>'
    resetCherryPick: '<c-R>'
    copyCommitMessageToClipboard: '<c-y>'
    openLogMenu: '<c-l>'
    openInBrowser: 'o'
    viewBisectOptions: 'b'

  stash:
    popStash: 'g'
    renameStash: 'r'

  commitFiles:
    checkoutCommitFile: 'c'

  main:
    toggleDragSelect: 'v'
    toggleDragSelect-alt: 'V'
    toggleSelectHunk: 'a'
    pickBothHunks: 'b'

  submodules:
    init: 'i'
    update: 'u'
    bulkMenu: 'b'

# ══════════════════════════════════════════════════════════════════════════════
#                              OS Settings
# ══════════════════════════════════════════════════════════════════════════════

os:
  editPreset: 'nvim'
  openCommand: 'open {{filename}}'

# ══════════════════════════════════════════════════════════════════════════════
#                              Refresh & Update
# ══════════════════════════════════════════════════════════════════════════════

refresher:
  refreshInterval: 10
  fetchInterval: 60

update:
  method: prompt
  days: 14

# ══════════════════════════════════════════════════════════════════════════════
#                              Confirmations
# ══════════════════════════════════════════════════════════════════════════════

confirmOnQuit: false
quitOnTopLevelReturn: false

# ══════════════════════════════════════════════════════════════════════════════
#                              Custom Commands
# ══════════════════════════════════════════════════════════════════════════════

customCommands:
  # Quick conventional commit
  - key: '<c-c>'
    command: 'git commit -m "{{index .PromptResponses 0}}: {{index .PromptResponses 1}}"'
    context: 'files'
    description: 'Conventional commit'
    prompts:
      - type: 'menu'
        title: 'Commit type'
        options:
          - name: 'feat'
            description: 'A new feature'
            value: 'feat'
          - name: 'fix'
            description: 'A bug fix'
            value: 'fix'
          - name: 'docs'
            description: 'Documentation changes'
            value: 'docs'
          - name: 'style'
            description: 'Code style changes'
            value: 'style'
          - name: 'refactor'
            description: 'Code refactoring'
            value: 'refactor'
          - name: 'perf'
            description: 'Performance improvements'
            value: 'perf'
          - name: 'test'
            description: 'Adding tests'
            value: 'test'
          - name: 'chore'
            description: 'Maintenance tasks'
            value: 'chore'
      - type: 'input'
        title: 'Commit message'
        initialValue: ''

  # Interactive rebase from selected commit
  - key: 'I'
    command: 'git rebase -i {{.SelectedLocalCommit.Sha}}^'
    context: 'commits'
    description: 'Interactive rebase from this commit'

  # Push force with lease
  - key: 'F'
    command: 'git push --force-with-lease'
    context: 'localBranches'
    description: 'Force push with lease'
    loadingText: 'Force pushing...'

  # Open in GitHub
  - key: 'O'
    command: 'gh browse'
    context: 'global'
    description: 'Open repo in GitHub'
