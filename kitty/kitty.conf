# ══════════════════════════════════════════════════════════════════════════════
#                              Kitty Configuration
#                         Claude-themed feature-rich terminal
# ══════════════════════════════════════════════════════════════════════════════

# ══════════════════════════════════════════════════════════════════════════════
#                              Fonts
# ══════════════════════════════════════════════════════════════════════════════

font_family      JetBrainsMono Nerd Font
bold_font        JetBrainsMono Nerd Font Bold
italic_font      JetBrainsMono Nerd Font Italic
bold_italic_font JetBrainsMono Nerd Font Bold Italic
font_size        14.0

# Font rendering
adjust_line_height  110%
adjust_column_width 0
disable_ligatures   never

# ══════════════════════════════════════════════════════════════════════════════
#                              Cursor
# ══════════════════════════════════════════════════════════════════════════════

cursor                  #d4a27f
cursor_text_color       #1a1816
cursor_shape            block
cursor_blink_interval   0.5
cursor_stop_blinking_after 0

# ══════════════════════════════════════════════════════════════════════════════
#                              Scrollback
# ══════════════════════════════════════════════════════════════════════════════

scrollback_lines        10000
scrollback_pager        less --chop-long-lines --RAW-CONTROL-CHARS +INPUT_LINE_NUMBER
wheel_scroll_multiplier 5.0
touch_scroll_multiplier 1.0

# ══════════════════════════════════════════════════════════════════════════════
#                              Mouse
# ══════════════════════════════════════════════════════════════════════════════

mouse_hide_wait         3.0
url_color               #8ea4a2
url_style               curly
open_url_with           default
url_prefixes            file ftp ftps gemini git gopher http https irc ircs kitty mailto news sftp ssh
detect_urls             yes
copy_on_select          no
strip_trailing_spaces   smart

# ══════════════════════════════════════════════════════════════════════════════
#                              Performance
# ══════════════════════════════════════════════════════════════════════════════

repaint_delay   10
input_delay     3
sync_to_monitor yes

# ══════════════════════════════════════════════════════════════════════════════
#                              Bell
# ══════════════════════════════════════════════════════════════════════════════

enable_audio_bell    no
visual_bell_duration 0.0
visual_bell_color    none
window_alert_on_bell yes
bell_on_tab          "  "

# ══════════════════════════════════════════════════════════════════════════════
#                              Window
# ══════════════════════════════════════════════════════════════════════════════

remember_window_size  yes
initial_window_width  120c
initial_window_height 36c
window_padding_width  12
window_margin_width   0
single_window_margin_width -1
placement_strategy    center
hide_window_decorations titlebar-only
confirm_os_window_close 0

# Window borders
active_border_color   #d4a27f
inactive_border_color #625e5a
bell_border_color     #c4746e
window_border_width   1pt

# Background
background_opacity    0.97
background_blur       20
dynamic_background_opacity yes

# ══════════════════════════════════════════════════════════════════════════════
#                              Tab Bar
# ══════════════════════════════════════════════════════════════════════════════

tab_bar_edge            bottom
tab_bar_margin_width    4.0
tab_bar_margin_height   4.0 0.0
tab_bar_style           powerline
tab_bar_align           left
tab_bar_min_tabs        2
tab_switch_strategy     previous
tab_powerline_style     slanted
tab_activity_symbol     *
tab_title_template      "{fmt.fg.red}{bell_symbol}{activity_symbol}{fmt.fg.tab}{index}: {title}"

# Tab colors
active_tab_foreground   #1a1816
active_tab_background   #d4a27f
active_tab_font_style   bold
inactive_tab_foreground #e8dfd6
inactive_tab_background #2a2725
inactive_tab_font_style normal
tab_bar_background      #1a1816
tab_bar_margin_color    #1a1816

# ══════════════════════════════════════════════════════════════════════════════
#                              Colors (Claude Theme)
# ══════════════════════════════════════════════════════════════════════════════

# Background and foreground
foreground              #e8dfd6
background              #1a1816
selection_foreground    #e8dfd6
selection_background    #3a3735

# Normal colors
color0  #2a2725
color1  #c4746e
color2  #8a9a7b
color3  #c4b28a
color4  #8ea4a2
color5  #a292a3
color6  #8ea4a2
color7  #e8dfd6

# Bright colors
color8  #625e5a
color9  #d4847e
color10 #9aaa8b
color11 #d4c29a
color12 #9eb4b2
color13 #b2a2b3
color14 #9eb4b2
color15 #f0e8e0

# Extended colors
mark1_foreground #1a1816
mark1_background #d4a27f
mark2_foreground #1a1816
mark2_background #8a9a7b
mark3_foreground #1a1816
mark3_background #8ea4a2

# ══════════════════════════════════════════════════════════════════════════════
#                              Advanced
# ══════════════════════════════════════════════════════════════════════════════

shell                 .
editor                nvim
close_on_child_death  no
allow_remote_control  yes
listen_on             unix:/tmp/kitty
update_check_interval 0
clipboard_control     write-clipboard write-primary read-clipboard-ask read-primary-ask
allow_hyperlinks      yes
shell_integration     enabled
term                  xterm-kitty

# ══════════════════════════════════════════════════════════════════════════════
#                              macOS Specific
# ══════════════════════════════════════════════════════════════════════════════

macos_titlebar_color            background
macos_option_as_alt             yes
macos_hide_from_tasks           no
macos_quit_when_last_window_closed yes
macos_window_resizable          yes
macos_thicken_font              0.25
macos_traditional_fullscreen    no
macos_show_window_title_in      window
macos_colorspace                srgb

# ══════════════════════════════════════════════════════════════════════════════
#                              Keyboard Shortcuts
# ══════════════════════════════════════════════════════════════════════════════

# Clear default shortcuts
clear_all_shortcuts no

# Kitty modifier
kitty_mod cmd

# Clipboard
map kitty_mod+c copy_to_clipboard
map kitty_mod+v paste_from_clipboard
map kitty_mod+s paste_from_selection
map shift+insert paste_from_selection

# Scrolling
map kitty_mod+up        scroll_line_up
map kitty_mod+down      scroll_line_down
map kitty_mod+page_up   scroll_page_up
map kitty_mod+page_down scroll_page_down
map kitty_mod+home      scroll_home
map kitty_mod+end       scroll_end
map kitty_mod+h         show_scrollback

# Window management
map kitty_mod+enter    new_window_with_cwd
map kitty_mod+n        new_os_window
map kitty_mod+w        close_window
map kitty_mod+]        next_window
map kitty_mod+[        previous_window
map kitty_mod+f        move_window_forward
map kitty_mod+b        move_window_backward
map kitty_mod+`        move_window_to_top
map kitty_mod+r        start_resizing_window
map kitty_mod+1        first_window
map kitty_mod+2        second_window
map kitty_mod+3        third_window
map kitty_mod+4        fourth_window
map kitty_mod+5        fifth_window

# Vim-style window navigation
map ctrl+shift+h neighboring_window left
map ctrl+shift+l neighboring_window right
map ctrl+shift+k neighboring_window up
map ctrl+shift+j neighboring_window down

# Tab management
map kitty_mod+t        new_tab_with_cwd
map kitty_mod+q        close_tab
map kitty_mod+right    next_tab
map kitty_mod+left     previous_tab
map ctrl+tab           next_tab
map ctrl+shift+tab     previous_tab
map kitty_mod+.        move_tab_forward
map kitty_mod+,        move_tab_backward
map kitty_mod+alt+t    set_tab_title

# Layout management
map kitty_mod+l next_layout
map kitty_mod+shift+l goto_layout stack
map kitty_mod+alt+l goto_layout tall

# Font size
map kitty_mod+plus      change_font_size all +1.0
map kitty_mod+minus     change_font_size all -1.0
map kitty_mod+0         change_font_size all 0

# Miscellaneous
map kitty_mod+u         kitten unicode_input
map kitty_mod+escape    kitty_shell window
map kitty_mod+a>m       set_background_opacity +0.1
map kitty_mod+a>l       set_background_opacity -0.1
map kitty_mod+a>1       set_background_opacity 1
map kitty_mod+a>d       set_background_opacity default
map kitty_mod+delete    clear_terminal reset active
map kitty_mod+k         clear_terminal to_cursor active
map kitty_mod+f5        load_config_file
map kitty_mod+f6        debug_config

# Hints (URL, file paths, etc.)
map kitty_mod+e open_url_with_hints
map kitty_mod+p>f kitten hints --type path --program -
map kitty_mod+p>l kitten hints --type line --program -
map kitty_mod+p>w kitten hints --type word --program -
