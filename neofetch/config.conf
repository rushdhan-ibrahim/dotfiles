# ══════════════════════════════════════════════════════════════════════════════
#                              Neofetch Configuration
#                         Claude's Welcome Experience
# ══════════════════════════════════════════════════════════════════════════════
#
# This configuration creates a warm, personalized welcome experience.
# ASCII art is selected based on terminal width.
# Greetings are contextual (time/season aware).

# ══════════════════════════════════════════════════════════════════════════════
#                              INFORMATION DISPLAY
# ══════════════════════════════════════════════════════════════════════════════

print_info() {
    # Custom greeting based on time of day
    local hour=$(date +%H)
    local greeting=""

    case $hour in
        0[5-7])   greeting="Dawn breaks. A fresh canvas awaits." ;;
        0[8-9]|1[0-1]) greeting="Good morning. Ready to create?" ;;
        1[2-6])   greeting="The afternoon unfolds. What shall we build?" ;;
        1[7-9])   greeting="Evening approaches. Time for focused work." ;;
        2[0-2])   greeting="The quiet hours. When great things are made." ;;
        *)        greeting="The world sleeps. But we create." ;;
    esac

    # Print the greeting
    prin "${greeting}"
    info underline

    info "OS" distro
    info "Host" model
    info "Kernel" kernel
    info "Uptime" uptime
    info "Packages" packages
    info "Shell" shell
    info "Terminal" term
    info "CPU" cpu
    info "Memory" memory

    info cols
}

# ══════════════════════════════════════════════════════════════════════════════
#                              TITLE SETTINGS
# ══════════════════════════════════════════════════════════════════════════════

title_fqdn="off"

# ══════════════════════════════════════════════════════════════════════════════
#                              SYSTEM INFO SETTINGS
# ══════════════════════════════════════════════════════════════════════════════

# Kernel
kernel_shorthand="on"

# Distro
distro_shorthand="off"
os_arch="off"

# Uptime
uptime_shorthand="on"

# Memory
memory_percent="on"
memory_unit="gib"

# Packages
package_managers="on"

# Shell
shell_path="off"
shell_version="on"

# CPU
speed_type="bios_limit"
speed_shorthand="on"
cpu_brand="on"
cpu_speed="on"
cpu_cores="logical"
cpu_temp="off"

# GPU
gpu_brand="on"
gpu_type="all"

# ══════════════════════════════════════════════════════════════════════════════
#                              COLOR SETTINGS
# ══════════════════════════════════════════════════════════════════════════════

# Claude palette mapped to terminal colors:
#   Color 1 (red)     → Coral #d4a27f
#   Color 2 (green)   → Sage #8a9a7b
#   Color 3 (yellow)  → Sand #c4b28a
#   Color 4 (blue)    → Teal #8ea4a2
#   Color 5 (magenta) → Dusty Rose #a292a3
#   Color 6 (cyan)    → Teal (lighter)
#   Color 7 (white)   → Foreground #e8dfd6

# Use coral and sand for info display
colors=(1 3)

bold="on"
underline_enabled="on"
underline_char="─"
separator=" ❯ "

# ══════════════════════════════════════════════════════════════════════════════
#                              COLOR BLOCKS
# ══════════════════════════════════════════════════════════════════════════════

block_range=(0 7)
color_blocks="on"
block_width=3
block_height=1
col_offset="auto"

# ══════════════════════════════════════════════════════════════════════════════
#                              ASCII ART SELECTION
# ══════════════════════════════════════════════════════════════════════════════

# Backend Settings
image_backend="ascii"

# Intelligent ASCII selection based on terminal width
# The image_source is set dynamically, but we provide a default
# Width-based selection:
#   < 60 cols  → minimal.txt
#   60-80 cols → friendly.txt
#   80-120 cols → retro.txt
#   > 120 cols → elaborate.txt

# Default to friendly (works well in most terminals)
image_source="${HOME}/.config/neofetch/ascii/friendly.txt"

# ASCII colors using Claude palette (coral, sand, cream, sage)
ascii_colors=(1 3 7 2)
ascii_bold="on"

# ══════════════════════════════════════════════════════════════════════════════
#                              IMAGE OPTIONS
# ══════════════════════════════════════════════════════════════════════════════

image_loop="off"
crop_mode="normal"
crop_offset="center"
image_size="auto"

# Gap between ASCII and info
gap=3

# Offsets
yoffset=0
xoffset=0

# ══════════════════════════════════════════════════════════════════════════════
#                              MISCELLANEOUS
# ══════════════════════════════════════════════════════════════════════════════

stdout="off"
